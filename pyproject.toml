[project]
name = "failure-taxonomy-harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rohan Jha", email = "22083737+deep-rj@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "minigrid>=3.1.0",
    "torch>=2.0",
]

[project.scripts]
failure-taxonomy-harness = "failure_taxonomy_harness:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
]
viz = [
    "pillow>=10.1",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]

[tool.pyright]
extraPaths = ["scripts"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
